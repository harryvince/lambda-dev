version: 1
defaultTarget: dev
targets:
  dev:
    functionName: my-existing-lambda-dev
    region: eu-west-2
    profile: default
    # Optional runtime environment patch; unrelated remote values are retained.
    # environment: &sharedEnvironment
    #   LOG_LEVEL: debug
    #   JAEGER_SERVICE_NAME: my-service
    #   ENABLE_TRACING: "true"
    #   OLD_FLAG: null # Explicit deletion; omitted keys are preserved.
    build: &sharedBuild
      entry: src/handler.ts
      bundle: true
      platform: node
      target: node20
      format: cjs
      sourcemap: true
      # Optional runtime assets (uncomment and replace with your paths):
      # copy:
      #   - from: assets/native-helper
      #     to: bin/native-helper
      #   - from: assets/runtime
      #     to: runtime
      #   - from: assets/schemas/**/*.json
      #     to: schemas
      external:
        - "@aws-sdk/*"
    watch:
      include:
        - src/**/*.ts
        # Add assets/**/* here to rebuild when copied assets change.
        # Add lambda-dev.yml here to deploy when configuration changes.
      exclude:
        - dist/**
        - node_modules/**
        - .lambda-dev/**
      debounceMs: 300
    invoke:
      afterDeploy: true
      payloadFile: events/dev.json

  # Reuse the dev build configuration and override individual options:
  # staging:
  #   functionName: my-existing-lambda-staging
  #   region: eu-west-2
  #   build:
  #     <<: *sharedBuild
  #     minify: true

  # To share environment values, uncomment the anchored environment above,
  # then add under staging:
  #   environment:
  #     <<: *sharedEnvironment
  #     LOG_LEVEL: info
