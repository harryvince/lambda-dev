[tools]
node = "26.4.0"
bun = "1.3.14"
uv = "0.12.19"
prek = "0.5.5"

[tasks.install]
description = "Install dependencies and the mandatory prek Git hooks."
run = ["bun install", "prek install"]

[tasks.typecheck]
description = "Typecheck source, tests, and scripts."
run = "bun run typecheck"

[tasks.test]
description = "Run the test suite with Bun."
run = "bun run test"

[tasks.build]
description = "Build the TypeScript package."
run = "bun run build"

[tasks.schema]
description = "Regenerate docs/schema.json from the config schema."
run = "bun scripts/generate-schema.ts"

[tasks."scan:deps"]
description = "Scan dependencies (bun.lock) for known vulnerabilities with Trivy."
tools = { trivy = "0.76.0" }
run = "trivy fs --scanners vuln --include-dev-deps --exit-code 1 ."

[tasks."scan:code"]
description = "Scan source code and workflows for security issues with Semgrep."
tools = { "pipx:semgrep" = "1.181.0" }
run = "semgrep scan --metrics=off --error --config p/default --config p/typescript --config p/nodejs --config p/github-actions"

[tasks.scan]
description = "Run all security scans."
depends = ["scan:deps", "scan:code"]

[tasks.lint]
description = "Lint with oxlint and the vendored anti-slop rules."
run = "bun run lint"

[tasks.format]
description = "Format the code with oxfmt."
run = "bun run format"

[tasks.fix]
description = "Apply oxlint autofixes and oxfmt until both are stable."
run = [
  "bun run lint --fix --quiet || true",
  "bun run format",
  "bun run lint --fix --quiet || true",
  "bun run format",
]

[tasks."format:check"]
description = "Check formatting without writing changes."
run = "bun run format:check"

[tasks.check]
description = "Run format check, lint, typecheck, tests, and build."
depends = ["format:check", "lint", "typecheck", "test", "build"]

[tasks.clean]
description = "Remove generated package artifacts."
run = "bun run clean"

[tasks.pack]
description = "Build and create an npm package tarball without publishing."
depends = ["build"]
run = "bun pm pack"

[tasks."publish:dry-run"]
description = "Build and run an npm publish dry run without publishing."
depends = ["build"]
run = "npm publish --dry-run"

[tasks.publish]
description = "Build and publish the package to npm using external npm auth."
depends = ["build"]
run = "bun publish"

[tasks.version]
description = "Runs standard-version and tags the repo"
run = "bunx standard-version && git push && git push --tags"

[tasks."docs:serve"]
description = "Preview the documentation site with live reload."
run = "uvx zensical@0.0.71 serve"

[tasks."docs:build"]
description = "Build the documentation site into site/."
run = "uvx zensical@0.0.71 build --clean --strict"
