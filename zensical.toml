[project]
site_name = "aws-lambda-dev"
site_description = "Hot-reload, deploy, and invoke existing AWS Lambda functions from a YAML-configured local workflow."
site_url = "https://harryvince.github.io/lambda-dev/"
repo_url = "https://github.com/harryvince/lambda-dev"
repo_name = "harryvince/lambda-dev"
edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    "commands.md",
    "configuration.md",
    "copying-files.md",
    "checks.md",
    "environment-variables.md",
    "rollback.md",
  ] },
  { "Reference" = [
    "iam-permissions.md",
    "troubleshooting.md",
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
